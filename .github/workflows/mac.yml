name: macOS GUI in Browser (noVNC)

on:
  workflow_dispatch:

jobs:
  macos-web-vnc:
    runs-on: macos-latest
    timeout-minutes: 245

    steps:
      - name: Configure VNC for Existing GUI Session
        shell: bash
        run: |
          set -euo pipefail

          ARD="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          VNC_PASSWORD="meow"

          CONSOLE_USER="$(stat -f '%Su' /dev/console)"

          if [[ "$CONSOLE_USER" == "root" || "$CONSOLE_USER" == "loginwindow" ]]; then
            echo "No active console session."
            exit 1
          fi

          echo "Using existing console user: $CONSOLE_USER"

          # Do NOT create another account.
          # Do NOT call sysadminctl.
          # Do NOT use kickstart -setvncpw.
          #
          # The following is the authentication configuration that
          # previously worked on this runner.

          sudo "$ARD" \
            -activate \
            -configure \
            -allowAccessFor -allUsers \
            -privs -all

          sudo "$ARD" \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes

          # Apple's legacy VNC password format.
          #
          # Legacy VNC only uses the first 8 characters.
          # "meow" is therefore completely safe for this test.

          VNC_HASH="$(
            printf '%s\n' "$VNC_PASSWORD" |
            perl -we '
              BEGIN {
                @k = unpack "C*", pack "H*",
                  "1734516E8BA8C5E2FF1C39567390ADCA";
              }

              $_ = <>;
              chomp;

              s/^(.{8}).*/$1/;

              @p = unpack "C*", $_;

              foreach (@k) {
                printf "%02X", $_ ^ (shift @p || 0);
              }

              print "\n";
            '
          )"

          printf '%s\n' "$VNC_HASH" |
            sudo tee /Library/Preferences/com.apple.VNCSettings.txt \
            >/dev/null

          sudo chmod 600 \
            /Library/Preferences/com.apple.VNCSettings.txt

          # Restart Apple's VNC/Remote Management stack.
          sudo "$ARD" -restart -agent -console

          sleep 8

          echo
          echo "VNC listener:"
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN

          if ! nc -z 127.0.0.1 5900; then
            echo "VNC server is not listening."
            exit 1
          fi

          echo
          echo "============================================================"
          echo "VNC READY"
          echo "============================================================"
          echo "Console user : $CONSOLE_USER"
          echo "VNC password : meow"
          echo "VNC port     : 5900"
          echo "============================================================"

      - name: Install noVNC and Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/novnc

          git clone --depth 1 \
            https://github.com/novnc/noVNC.git \
            /tmp/novnc

          git clone --depth 1 \
            https://github.com/novnc/websockify \
            /tmp/novnc/utils/websockify

          brew install cloudflared

      - name: Start noVNC
        shell: bash
        run: |
          set -euo pipefail

          /tmp/novnc/utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 6080 \
            >/tmp/novnc.log 2>&1 &

          sleep 3

          if ! nc -z 127.0.0.1 6080; then
            cat /tmp/novnc.log
            exit 1
          fi

      - name: Start Cloudflare Tunnel
        shell: bash
        run: |
          set -euo pipefail

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --logfile /tmp/cloudflared.log \
            >/tmp/cloudflared.stdout 2>&1 &

          TUNNEL_URL=""

          for _ in {1..30}; do
            TUNNEL_URL="$(
              grep -Eo \
                'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
                /tmp/cloudflared.log \
                /tmp/cloudflared.stdout \
                2>/dev/null |
              head -n 1 ||
              true
            )"

            [[ -n "$TUNNEL_URL" ]] && break
            sleep 1
          done

          if [[ -z "$TUNNEL_URL" ]]; then
            echo "Could not obtain Cloudflare URL."
            cat /tmp/cloudflared.log || true
            cat /tmp/cloudflared.stdout || true
            exit 1
          fi

          echo
          echo "============================================================"
          echo "WEB DESKTOP"
          echo "============================================================"
          echo
          echo "$TUNNEL_URL/vnc.html?autoconnect=true"
          echo
          echo "VNC password: meow"
          echo
          echo "============================================================"

      - name: Keep Session Alive
        shell: bash
        run: |
          sleep 14400
