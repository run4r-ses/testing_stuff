name: macOS VM

on:
  workflow_dispatch:

jobs:
  macos-rdp:
    runs-on: macos-latest
    timeout-minutes: 370

    env:
      RDP_USERNAME: goldenrecipe
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD || secrets.RUSTDESK_PASSWORD }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Connect to Tailscale
        if: env.TAILSCALE_AUTHKEY != ''
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: macos-runner
          args: --accept-dns=false

      - name: Install dependencies
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          echo "- Installing display utilities, tunnel tools, and Python packages"
          brew install --cask desktoppr 2>/dev/null || true
          brew tap jakehilborn/jakehilborn 2>/dev/null || true
          brew install displayplacer bore-cli 2>/dev/null || true

          # Install Python dependencies across all available Python environments
          echo "- Installing Python dependencies (asyncvnc)"
          python3 -m pip install --break-system-packages --upgrade pip setuptools wheel 2>/dev/null || true
          python3 -m pip install --break-system-packages asyncvnc 2>/dev/null || \
          pip3 install --break-system-packages asyncvnc 2>/dev/null || \
          python3 -m pip install asyncvnc 2>/dev/null || true

          for py in /opt/homebrew/bin/python3 /usr/local/bin/python3 /usr/bin/python3; do
            if [[ -x "$py" ]]; then
              "$py" -m pip install --break-system-packages asyncvnc 2>/dev/null || true
            fi
          done

          # Direct fallback for displayplacer if Homebrew tap/install failed
          if ! command -v displayplacer >/dev/null 2>&1 && [[ ! -x /opt/homebrew/bin/displayplacer ]] && [[ ! -x /usr/local/bin/displayplacer ]]; then
            echo "- Downloading displayplacer binary fallback from GitHub Releases"
            ARCH="$(uname -m)"
            if [[ "$ARCH" == "arm64" || "$ARCH" == "aarch64" ]]; then
              curl -fsSL "https://github.com/jakehilborn/displayplacer/releases/download/v1.4.0/displayplacer-apple" -o /tmp/displayplacer 2>/dev/null || \
              curl -fsSL "https://github.com/jakehilborn/displayplacer/releases/latest/download/displayplacer-apple" -o /tmp/displayplacer 2>/dev/null || true
            else
              curl -fsSL "https://github.com/jakehilborn/displayplacer/releases/download/v1.4.0/displayplacer-intel" -o /tmp/displayplacer 2>/dev/null || \
              curl -fsSL "https://github.com/jakehilborn/displayplacer/releases/latest/download/displayplacer-intel" -o /tmp/displayplacer 2>/dev/null || true
            fi

            if [[ ! -s /tmp/displayplacer ]] && command -v clang >/dev/null 2>&1; then
              echo "- Compiling displayplacer from source via clang"
              curl -fsSL "https://raw.githubusercontent.com/jakehilborn/displayplacer/master/src/displayplacer.c" -o /tmp/displayplacer.c 2>/dev/null || \
              curl -fsSL "https://raw.githubusercontent.com/jakehilborn/displayplacer/master/displayplacer.c" -o /tmp/displayplacer.c 2>/dev/null || true
              if [[ -f /tmp/displayplacer.c ]]; then
                clang -framework Foundation -framework CoreGraphics -framework IOKit -framework ApplicationServices -O2 /tmp/displayplacer.c -o /tmp/displayplacer 2>/dev/null || true
              fi
            fi

            if [[ -s /tmp/displayplacer ]]; then
              chmod +x /tmp/displayplacer
              sudo cp /tmp/displayplacer /usr/local/bin/displayplacer 2>/dev/null || sudo cp /tmp/displayplacer /opt/homebrew/bin/displayplacer 2>/dev/null || true
            fi
          fi

          # Direct fallback for desktoppr if Homebrew cask failed
          if ! command -v desktoppr >/dev/null 2>&1 && [[ ! -x /opt/homebrew/bin/desktoppr ]] && [[ ! -x /usr/local/bin/desktoppr ]]; then
            echo "- Downloading desktoppr installer fallback"
            curl -fsSL "https://github.com/scriptingosx/desktoppr/releases/download/v0.4/desktoppr-0.4.pkg" -o /tmp/desktoppr.pkg 2>/dev/null || true
            if [[ -f /tmp/desktoppr.pkg ]]; then
              sudo installer -pkg /tmp/desktoppr.pkg -target / 2>/dev/null || true
            fi
          fi

          # Direct fallback for bore if Homebrew was rate-limited or failed
          if ! command -v bore >/dev/null 2>&1 && [[ ! -x /usr/local/bin/bore ]] && [[ ! -x /opt/homebrew/bin/bore ]]; then
            echo "- Downloading bore binary fallback from GitHub Releases"
            ARCH="$(uname -m)"
            if [[ "$ARCH" == "arm64" || "$ARCH" == "aarch64" ]]; then
              curl -fsSL "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-aarch64-apple-darwin.tar.gz" -o /tmp/bore.tar.gz
            else
              curl -fsSL "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-apple-darwin.tar.gz" -o /tmp/bore.tar.gz
            fi
            tar -xzf /tmp/bore.tar.gz -C /tmp/
            sudo cp /tmp/bore /usr/local/bin/bore 2>/dev/null || sudo cp /tmp/bore /opt/homebrew/bin/bore 2>/dev/null || chmod +x /tmp/bore
          fi

      - name: Setup user
        shell: bash
        run: bash scripts/setup.sh

      - name: Patch TCC permissions
        shell: bash
        run: bash scripts/tcc.sh

      - name: Optimize macOS
        shell: bash
        run: bash scripts/optimize/main.sh

      - name: Configure Apple Remote Desktop
        shell: bash
        run: bash scripts/rdp/main.sh

      - name: Connection information
        shell: bash
        run: bash scripts/rdp/info.sh

      - name: Monitor session
        shell: bash
        run: bash scripts/rdp/keepalive.sh
