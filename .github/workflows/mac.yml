name: macOS GUI in Browser (x11vnc + noVNC)

on:
  workflow_dispatch:

jobs:
  macos-web-vnc:
    runs-on: macos-latest

    steps:
      - name: Install x11vnc, noVNC and Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing dependencies..."

          brew install x11vnc cloudflared

          rm -rf /tmp/novnc

          git clone --depth 1 \
            https://github.com/novnc/noVNC.git \
            /tmp/novnc

          git clone --depth 1 \
            https://github.com/novnc/websockify \
            /tmp/novnc/utils/websockify

          echo
          echo "Versions:"
          x11vnc -version || true
          cloudflared --version
          python3 --version

      - name: Start x11vnc
        shell: bash
        run: |
          set -euo pipefail

          /opt/homebrew/bin/x11vnc -help 2>&1 | sed -n '/MACOSX/,/MISC/p'
          /opt/homebrew/bin/x11vnc -help 2>&1 | grep -A100 -B10 -Ei 'macosx|macos|CGDisplay|CGL|framebuffer'

          echo "============================================================"
          echo "Starting x11vnc native macOS framebuffer"
          echo "============================================================"

          mkdir -p /tmp/x11vnc

          # Do NOT use "-display console".
          #
          # On this runner x11vnc's console_guess resolves the
          # framebuffer to /dev/null and then crashes.
          #
          # Explicitly request the native macOS raw framebuffer.
          /opt/homebrew/bin/x11vnc \
            -display console \
            -env X11VNC_MACOSX_NO_DEPRECATED_FRAMEBUFFER=1 \
            -rfbport 5900 \
            -localhost \
            -forever \
            -shared \
            -nopw \
            -noxdamage \
            > /tmp/x11vnc/x11vnc.log 2>&1 &

          X11VNC_PID=$!
          echo "$X11VNC_PID" > /tmp/x11vnc/x11vnc.pid

          echo "x11vnc PID: $X11VNC_PID"

          for i in {1..30}; do
            if nc -z 127.0.0.1 5900 2>/dev/null; then
              echo "VNC server is listening."
              break
            fi

            if ! kill -0 "$X11VNC_PID" 2>/dev/null; then
              echo
              echo "x11vnc exited."
              cat /tmp/x11vnc/x11vnc.log
              exit 1
            fi

            sleep 1
          done

          if ! nc -z 127.0.0.1 5900 2>/dev/null; then
            echo "x11vnc failed to open port 5900."
            cat /tmp/x11vnc/x11vnc.log
            exit 1
          fi

          echo
          echo "x11vnc is running."
          echo
          tail -n 50 /tmp/x11vnc/x11vnc.log

      - name: Start noVNC
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Starting noVNC"
          echo "============================================================"

          /tmp/novnc/utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 6080 \
            > /tmp/novnc.log 2>&1 &

          NOVNC_PID=$!
          echo "$NOVNC_PID" > /tmp/novnc.pid

          for i in {1..30}; do
            if nc -z 127.0.0.1 6080 2>/dev/null; then
              echo "noVNC is listening on 127.0.0.1:6080"
              break
            fi

            if ! kill -0 "$NOVNC_PID" 2>/dev/null; then
              echo "noVNC exited:"
              cat /tmp/novnc.log
              exit 1
            fi

            sleep 1
          done

          if ! nc -z 127.0.0.1 6080 2>/dev/null; then
            echo "noVNC never opened port 6080."
            cat /tmp/novnc.log
            exit 1
          fi

          cat /tmp/novnc.log

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Starting Cloudflare Quick Tunnel"
          echo "============================================================"

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --logfile /tmp/cloudflared.log \
            > /tmp/cloudflared.stdout 2>&1 &

          CLOUDFLARED_PID=$!
          echo "$CLOUDFLARED_PID" > /tmp/cloudflared.pid

          TUNNEL_URL=""

          for i in {1..60}; do
            TUNNEL_URL="$(
              grep -Eo \
                'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
                /tmp/cloudflared.log \
                /tmp/cloudflared.stdout \
                2>/dev/null |
                head -n 1 ||
                true
            )"

            if [[ -n "$TUNNEL_URL" ]]; then
              break
            fi

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo "cloudflared exited unexpectedly."
              cat /tmp/cloudflared.log || true
              cat /tmp/cloudflared.stdout || true
              exit 1
            fi

            sleep 1
          done

          if [[ -z "$TUNNEL_URL" ]]; then
            echo "Could not obtain Cloudflare tunnel URL."
            echo
            cat /tmp/cloudflared.log || true
            cat /tmp/cloudflared.stdout || true
            exit 1
          fi

          echo
          echo "============================================================"
          echo "macOS WEB DESKTOP"
          echo "============================================================"
          echo
          echo "Browser:"
          echo "${TUNNEL_URL}/vnc.html?autoconnect=true"
          echo
          echo "VNC authentication: DISABLED"
          echo "VNC server: x11vnc"
          echo "Display: native macOS console framebuffer"
          echo
          echo "============================================================"

      - name: Keep session alive
        shell: bash
        run: |
          set -euo pipefail

          echo "Session will remain active for 4 hours."

          sleep 14400
