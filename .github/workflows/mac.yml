name: macOS VM

on:
  workflow_dispatch:

jobs:
  macos-rdp:
    runs-on: macos-latest
    timeout-minutes: 370

    env:
      RDP_USERNAME: goldenrecipe
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD || secrets.RUSTDESK_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          echo "- Installing display utilities, tunnel tools, and websockify"
          brew install --cask desktoppr 2>/dev/null || true
          brew install displayplacer bore-cli 2>/dev/null || true
          brew install websockify 2>/dev/null || pip3 install --break-system-packages websockify 2>/dev/null || pip3 install websockify 2>/dev/null || true

          # Direct fallback for desktoppr if Homebrew cask failed
          if ! command -v desktoppr >/dev/null 2>&1 && [[ ! -x /opt/homebrew/bin/desktoppr ]] && [[ ! -x /usr/local/bin/desktoppr ]]; then
            echo "- Downloading desktoppr installer fallback"
            curl -fsSL "https://github.com/scriptingosx/desktoppr/releases/download/v0.4/desktoppr-0.4.pkg" -o /tmp/desktoppr.pkg 2>/dev/null || true
            if [[ -f /tmp/desktoppr.pkg ]]; then
              sudo installer -pkg /tmp/desktoppr.pkg -target / 2>/dev/null || true
            fi
          fi

          # Direct fallback for bore if Homebrew was rate-limited or failed
          if ! command -v bore >/dev/null 2>&1; then
            echo "- Downloading bore binary from GitHub releases"
            ARCH="$(uname -m)"
            if [[ "$ARCH" == "arm64" || "$ARCH" == "aarch64" ]]; then
              curl -fsSL "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-aarch64-apple-darwin.tar.gz" -o /tmp/bore.tar.gz
            else
              curl -fsSL "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-apple-darwin.tar.gz" -o /tmp/bore.tar.gz
            fi
            tar -xzf /tmp/bore.tar.gz -C /tmp/
            sudo cp /tmp/bore /usr/local/bin/bore 2>/dev/null || sudo cp /tmp/bore /opt/homebrew/bin/bore 2>/dev/null || chmod +x /tmp/bore
          fi

          echo "- Pre-cloning noVNC web client"
          git clone --depth 1 https://github.com/novnc/noVNC.git /Users/Shared/noVNC 2>/dev/null || true

      - name: Setup user
        shell: bash
        run: bash scripts/setup.sh

      - name: Patch TCC permissions
        shell: bash
        run: bash scripts/tcc.sh

      - name: Optimize macOS
        shell: bash
        run: bash scripts/optimize/main.sh

      - name: Configure Apple Remote Desktop
        shell: bash
        run: bash scripts/rdp/main.sh

      - name: Connection information
        shell: bash
        run: bash scripts/rdp/info.sh

      - name: Monitor session
        shell: bash
        run: bash scripts/rdp/keepalive.sh
