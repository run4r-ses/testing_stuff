name: macOS GUI in Browser (noVNC)

on:
  workflow_dispatch:

jobs:
  macos-web-vnc:
    runs-on: macos-latest
    steps:
      - name: Launch macOS GUI, noVNC & Cloudflare Tunnel
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          # 1. Prevent virtual display, disk, and system sleep
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0
          caffeinate -d -i -m -u &

          # 2. Create the runneradmin account
          sudo dscl . -create /Users/runneradmin
          sudo dscl . -create /Users/runneradmin UserShell /bin/bash
          sudo dscl . -create /Users/runneradmin RealName "Runner Admin"
          sudo dscl . -create /Users/runneradmin UniqueID 1001
          sudo dscl . -create /Users/runneradmin PrimaryGroupID 80
          sudo dscl . -create /Users/runneradmin NFSHomeDirectory /Users/runneradmin
          sudo dscl . -passwd /Users/runneradmin "$VNC_PASSWORD"
          sudo createhomedir -c -u runneradmin > /dev/null 2>&1 || true
          sudo dscl . -append /Groups/admin GroupMembership runneradmin

          # 3. Configure Auto-Login for runneradmin (Generates macOS kcpassword structure)
          python3 -c "
          import sys
          passwd = sys.argv[1]
          key = [125, 137, 82, 35, 210, 188, 221, 234, 163, 185, 31]
          pad = 12 - (len(passwd) % 12) if (len(passwd) % 12) != 0 else 0
          raw = passwd.encode('utf-8') + (b'\x00' * pad)
          encoded = bytearray([b ^ key[i % len(key)] for i, b in enumerate(raw)])
          with open('/etc/kcpassword', 'wb') as f:
              f.write(encoded)
          " "$VNC_PASSWORD"
          sudo chmod 600 /etc/kcpassword
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser "runneradmin"

          # 4. Configure Apple Remote Management & Legacy VNC authentication
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -allowAccessFor -allUsers -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes

          echo "$VNC_PASSWORD" | perl -we '
            BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"};
            $_ = <>; chomp; s/^(.{8}).*/$1/;
            @p = unpack "C*", $_;
            foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) };
            print "\n"
          ' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt > /dev/null
          sudo chmod 600 /Library/Preferences/com.apple.VNCSettings.txt

          # 5. Restart loginwindow to trigger auto-login and boot the graphical session
          sudo killall -9 loginwindow || true
          sleep 6

          # 6. Bind ARD to the active console desktop session
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent -console
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate

          # 7. Install dependencies
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc
          git clone --depth 1 https://github.com/novnc/websockify /tmp/novnc/utils/websockify
          brew install cloudflared

          # 8. Start noVNC bridge
          /tmp/novnc/utils/novnc_proxy --vnc 127.0.0.1:5900 --listen 6080 --web /tmp/novnc > /tmp/novnc.log 2>&1 &

          # 9. Start Cloudflare Tunnel and wait for DNS registration
          cloudflared tunnel --url http://127.0.0.1:6080 --logfile /tmp/cloudflared.log > /dev/null 2>&1 &

          echo "Establishing Cloudflare Tunnel..."
          TUNNEL_URL=""
          for i in {1..30}; do
            if [ -f /tmp/cloudflared.log ]; then
              TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
              if [ -n "$TUNNEL_URL" ]; then
                break
              fi
            fi
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Error: Could not retrieve Cloudflare URL. Tunnel logs:"
            cat /tmp/cloudflared.log
            exit 1
          fi

          # Allow edge DNS to propagate
          sleep 4

          echo "================================================================="
          echo "Web Desktop Link:"
          echo "$TUNNEL_URL/vnc.html?autoconnect=true&resize=scale"
          echo "-----------------------------------------------------------------"
          echo "Password: (Your configured VNC_PASSWORD secret)"
          echo "================================================================="

          # 10. Keep the single step running
          wait
