name: macOS GUI Display Test

on:
  workflow_dispatch:

jobs:
  macos-display:
    runs-on: macos-latest
    timeout-minutes: 245

    steps:
      - name: Install display server dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install cloudflared

      - name: Verify GUI session
        shell: bash
        run: |
          set -euo pipefail

          CONSOLE_USER="$(stat -f '%Su' /dev/console)"

          echo "Console user: $CONSOLE_USER"

          if [[ "$CONSOLE_USER" == "root" || "$CONSOLE_USER" == "loginwindow" ]]; then
            echo "No active graphical console session."
            exit 1
          fi

          if ! pgrep -x WindowServer >/dev/null; then
            echo "WindowServer is not running."
            exit 1
          fi

          echo "GUI session is active."

      - name: Start screenshot web server
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/display"

          cat > "$RUNNER_TEMP/display/server.py" <<'PY'
          import http.server
          import os
          import subprocess
          import time

          ROOT = os.environ["RUNNER_TEMP"] + "/display"
          PORT = 6080

          os.makedirs(ROOT, exist_ok=True)

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/":
                      self.send_response(200)
                      self.send_header("Content-Type", "text/html; charset=utf-8")
                      self.end_headers()

                      html = """
                      <!doctype html>
                      <html>
                      <head>
                        <meta charset="utf-8">
                        <title>macOS Runner</title>
                        <style>
                          html, body {
                            margin: 0;
                            background: #111;
                            width: 100%;
                            height: 100%;
                            overflow: hidden;
                          }
                          img {
                            width: 100%;
                            height: 100%;
                            object-fit: contain;
                          }
                        </style>
                      </head>
                      <body>
                        <img id="screen" src="/screen.png">
                        <script>
                          setInterval(() => {
                            document.getElementById("screen").src =
                              "/screen.png?t=" + Date.now();
                          }, 1000);
                        </script>
                      </body>
                      </html>
                      """

                      self.wfile.write(html.encode())
                      return

                  if self.path.startswith("/screen.png"):
                      path = os.path.join(ROOT, "screen.png")

                      if not os.path.exists(path):
                          self.send_error(404)
                          return

                      with open(path, "rb") as f:
                          data = f.read()

                      self.send_response(200)
                      self.send_header("Content-Type", "image/png")
                      self.send_header("Content-Length", str(len(data)))
                      self.send_header("Cache-Control", "no-store")
                      self.end_headers()
                      self.wfile.write(data)
                      return

                  self.send_error(404)

              def log_message(self, *args):
                  pass

          http.server.ThreadingHTTPServer(
              ("127.0.0.1", PORT),
              Handler
          ).serve_forever()
          PY

          python3 "$RUNNER_TEMP/display/server.py" \
            > "$RUNNER_TEMP/display-server.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/display-server.pid"

      - name: Capture macOS display
        shell: bash
        run: |
          set -euo pipefail

          DISPLAY_DIR="$RUNNER_TEMP/display"

          while true; do
            screencapture \
              -x \
              -C \
              "$DISPLAY_DIR/screen.png" \
              >/dev/null 2>&1 || true

            sleep 1
          done &

          echo $! > "$RUNNER_TEMP/screencapture.pid"

      - name: Start Cloudflare tunnel
        shell: bash
        run: |
          set -euo pipefail

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --logfile "$RUNNER_TEMP/cloudflared.log" \
            > "$RUNNER_TEMP/cloudflared.stdout" 2>&1 &

          CLOUDFLARED_PID=$!

          TUNNEL_URL=""

          for _ in {1..30}; do
            sleep 1

            TUNNEL_URL="$(
              grep -Eo \
                'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
                "$RUNNER_TEMP/cloudflared.log" \
                "$RUNNER_TEMP/cloudflared.stdout" \
                2>/dev/null |
              head -n 1 ||
              true
            )"

            if [[ -n "$TUNNEL_URL" ]]; then
              break
            fi
          done

          if [[ -z "$TUNNEL_URL" ]]; then
            echo "Could not obtain Cloudflare URL."
            cat "$RUNNER_TEMP/cloudflared.log" || true
            exit 1
          fi

          echo
          echo "============================================================"
          echo "MACOS DISPLAY"
          echo "============================================================"
          echo
          echo "$TUNNEL_URL"
          echo
          echo "============================================================"

      - name: Keep session alive
        shell: bash
        run: |
          sleep 14400
