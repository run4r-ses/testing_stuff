name: macOS VM

on:
  workflow_dispatch:

jobs:
  macos-rustdesk:
    runs-on: macos-latest
    timeout-minutes: 370

    env:
      RUSTDESK_USERNAME: runneradmin
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        shell: bash
        run: |
          echo "- Installing display utilities"
          brew install displayplacer desktoppr

          echo "- Installing RustDesk"
          brew install --cask rustdesk

      - name: Setup user
        shell: bash
        run: bash scripts/setup.sh

      - name: Optimize macOS
        shell: bash
        run: bash scripts/optimize/main.sh

      - name: Patch TCC permissions
        shell: bash
        run: bash scripts/tcc.sh

      - name: Configure and start RustDesk
        shell: bash
        run: bash scripts/rustdesk.sh

      - name: Monitor RustDesk session
        shell: bash
        run: bash scripts/keepalive.sh
