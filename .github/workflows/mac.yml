name: macOS GUI in Browser (TCC VNC Test)

on:
  workflow_dispatch:

jobs:
  macos-vnc:
    runs-on: macos-latest
    timeout-minutes: 370

    steps:
      - name: Create GUI User and Configure VNC
        shell: bash
        run: |
          set -euo pipefail

          USERNAME="runneradmin"
          PASSWORD="meow"
          USER_UID="502"

          ARD="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          echo "============================================================"
          echo "Creating VNC GUI user"
          echo "============================================================"

          if id "$USERNAME" >/dev/null 2>&1; then
            echo "$USERNAME already exists"
            sudo dscl . -passwd "/Users/$USERNAME" "$PASSWORD"
          else
            sudo dscl . -create "/Users/$USERNAME"
            sudo dscl . -create "/Users/$USERNAME" UserShell /bin/bash
            sudo dscl . -create "/Users/$USERNAME" RealName "Runner Admin"
            sudo dscl . -create "/Users/$USERNAME" UniqueID "$USER_UID"
            sudo dscl . -create "/Users/$USERNAME" PrimaryGroupID 20
            sudo dscl . -create "/Users/$USERNAME" NFSHomeDirectory "/Users/$USERNAME"
            sudo dscl . -passwd "/Users/$USERNAME" "$PASSWORD"

            sudo createhomedir \
              -c \
              -u "$USERNAME" \
              >/dev/null 2>&1 || true
          fi

          sudo dseditgroup \
            -o edit \
            -a "$USERNAME" \
            -t user \
            admin

          echo
          echo "User information:"
          id "$USERNAME"

          echo
          echo "============================================================"
          echo "Configuring GUI session"
          echo "============================================================"

          # Configure automatic login for the new account.
          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            "$USERNAME"

          # Attempt to switch the current GUI session.
          # This is intentionally best-effort.
          sudo /System/Library/CoreServices/Menu\ Extras/User.menu/Contents/Resources/CGSession \
            -switchToUserID "$USER_UID" \
            2>/tmp/cgsession.err || true

          sleep 5

          echo
          echo "Console user:"
          stat -f '%Su' /dev/console

          echo
          echo "Logged-in users:"
          who

          if [[ -s /tmp/cgsession.err ]]; then
            echo
            echo "CGSession output:"
            cat /tmp/cgsession.err || true
          fi

          echo
          echo "============================================================"
          echo "TCC Screen Recording experiment"
          echo "============================================================"

          TCC_SYSTEM="/Library/Application Support/com.apple.TCC/TCC.db"
          TCC_USER="/Users/$USERNAME/Library/Application Support/com.apple.TCC/TCC.db"

          patch_tcc() {
            local DB="$1"

            if [[ ! -f "$DB" ]]; then
              echo
              echo "TCC database does not exist:"
              echo "$DB"
              return 0
            fi

            echo
            echo "TCC database:"
            echo "$DB"

            echo
            echo "--- access schema ---"

            sudo sqlite3 "$DB" \
              "PRAGMA table_info(access);" \
              || true

            local HAS_AUTH_VALUE

            HAS_AUTH_VALUE="$(
              sudo sqlite3 "$DB" \
                "SELECT COUNT(*)
                 FROM pragma_table_info('access')
                 WHERE name='auth_value';"
            )"

            if [[ "$HAS_AUTH_VALUE" != "1" ]]; then
              echo
              echo "This TCC database does not expose auth_value."
              echo "Skipping patch."
              return 0
            fi

            local NOW
            NOW="$(date +%s)"

            echo
            echo "Attempting Screen Recording grant..."

            #
            # Modern TCC schemas have changed over macOS releases.
            #
            # We deliberately specify columns rather than relying on
            # positional INSERTs into the entire table.
            #

            local SQL="
              INSERT OR REPLACE INTO access
              (
                service,
                client,
                client_type,
                auth_value,
                auth_reason,
                auth_version,
                policy_id,
                indirect_object_identifier_type,
                indirect_object_identifier,
                flags,
                last_modified
              )
              SELECT
                'kTCCServiceScreenCapture',
                'com.apple.screensharing',
                0,
                2,
                2,
                1,
                NULL,
                0,
                'UNUSED',
                0,
                $NOW
              WHERE
                EXISTS (
                  SELECT 1
                  FROM pragma_table_info('access')
                  WHERE name='service'
                )
                AND EXISTS (
                  SELECT 1
                  FROM pragma_table_info('access')
                  WHERE name='client'
                )
                AND EXISTS (
                  SELECT 1
                  FROM pragma_table_info('access')
                  WHERE name='auth_value'
                );
            "

            if sudo sqlite3 "$DB" "$SQL" 2>&1; then
              echo "SQLite accepted the ScreenCapture modification."
            else
              echo "SQLite rejected the ScreenCapture modification."
            fi

            echo
            echo "--- ScreenCapture rows ---"

            sudo sqlite3 -header -column "$DB" "
              SELECT
                service,
                client,
                client_type,
                auth_value,
                auth_reason,
                auth_version,
                flags,
                last_modified
              FROM access
              WHERE service='kTCCServiceScreenCapture';
            " || true
          }

          patch_tcc "$TCC_SYSTEM"

          if [[ -d "/Users/$USERNAME/Library/Application Support/com.apple.TCC" ]]; then
            sudo chown -R \
              "$USERNAME":staff \
              "/Users/$USERNAME/Library/Application Support/com.apple.TCC" \
              2>/dev/null || true
          fi

          patch_tcc "$TCC_USER"

          echo
          echo "Restarting tccd..."

          sudo killall -9 tccd 2>/dev/null || true

          sleep 3

          echo
          echo "============================================================"
          echo "Configuring Apple Remote Management"
          echo "============================================================"

          sudo "$ARD" \
            -activate \
            -configure \
            -access -on \
            -users "$USERNAME" \
            -privs -all \
            -restart

          sleep 5

          echo
          echo "============================================================"
          echo "Configuring legacy VNC authentication"
          echo "============================================================"

          #
          # macOS legacy VNC authentication uses the old DES-style
          # password transformation. We intentionally do not use
          # kickstart -setvncpw.
          #

          VNC_HASH="$(
            printf '%s\n' "$PASSWORD" |
            perl -we '
              BEGIN {
                @k = unpack "C*", pack "H*",
                  "1734516E8BA8C5E2FF1C39567390ADCA";
              }

              $_ = <>;
              chomp;

              s/^(.{8}).*/$1/;

              @p = unpack "C*", $_;

              foreach (@k) {
                printf "%02X", $_ ^ (shift @p || 0);
              }

              print "\n";
            '
          )"

          printf '%s\n' "$VNC_HASH" |
            sudo tee /Library/Preferences/com.apple.VNCSettings.txt \
            >/dev/null

          sudo chmod 600 \
            /Library/Preferences/com.apple.VNCSettings.txt

          sudo "$ARD" \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes

          sudo "$ARD" \
            -restart \
            -agent \
            -console

          sleep 10

          echo
          echo "============================================================"
          echo "Final VNC state"
          echo "============================================================"

          echo
          echo "Console user:"
          stat -f '%Su' /dev/console

          echo
          echo "Logged-in users:"
          who

          echo
          echo "VNC listener:"
          sudo lsof \
            -nP \
            -iTCP:5900 \
            -sTCP:LISTEN \
            || true

          echo
          echo "VNC TCP connectivity:"

          if nc -z 127.0.0.1 5900; then
            echo "VNC TCP port 5900 is reachable."
          else
            echo "ERROR: VNC TCP port 5900 is not reachable."
            exit 1
          fi

          echo
          echo "Remote Management processes:"
          ps aux | grep -Ei \
            '[A]RDAgent|[Ss]creensharingd|[Ss]creensharingAgent|[Vv]NCPrivilegeProxy' \
            || true

      - name: Install noVNC and Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Installing noVNC"
          echo "============================================================"

          rm -rf /tmp/novnc

          git clone \
            --depth 1 \
            https://github.com/novnc/noVNC.git \
            /tmp/novnc

          git clone \
            --depth 1 \
            https://github.com/novnc/websockify \
            /tmp/novnc/utils/websockify

          echo
          echo "Installing cloudflared..."

          brew install cloudflared

      - name: Start noVNC and Cloudflare
        shell: bash
        env:
          VNC_USERNAME: runneradmin
          VNC_PASSWORD: meow
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Starting noVNC"
          echo "============================================================"

          /tmp/novnc/utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 6080 \
            >/tmp/novnc.log 2>&1 &

          NOVNC_PID=$!

          sleep 4

          if ! kill -0 "$NOVNC_PID" 2>/dev/null; then
            echo "ERROR: noVNC exited."

            cat /tmp/novnc.log || true

            exit 1
          fi

          if ! nc -z 127.0.0.1 6080; then
            echo "ERROR: noVNC is not listening on port 6080."

            cat /tmp/novnc.log || true

            exit 1
          fi

          echo "noVNC is listening on port 6080."

          echo
          echo "============================================================"
          echo "Starting Cloudflare Quick Tunnel"
          echo "============================================================"

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --logfile /tmp/cloudflared.log \
            >/tmp/cloudflared.stdout 2>&1 &

          CLOUDFLARED_PID=$!

          TUNNEL_URL=""

          for _ in {1..30}; do
            TUNNEL_URL="$(
              {
                cat /tmp/cloudflared.log 2>/dev/null || true
                cat /tmp/cloudflared.stdout 2>/dev/null || true
              } |
              grep -Eo \
                'https://[A-Za-z0-9.-]+\.trycloudflare\.com' |
              head -n 1 ||
              true
            )"

            if [[ -n "$TUNNEL_URL" ]]; then
              break
            fi

            sleep 1
          done

          if [[ -z "$TUNNEL_URL" ]]; then
            echo "ERROR: Could not obtain Cloudflare tunnel URL."

            echo
            echo "--- cloudflared.log ---"
            cat /tmp/cloudflared.log || true

            echo
            echo "--- cloudflared.stdout ---"
            cat /tmp/cloudflared.stdout || true

            exit 1
          fi

          echo
          echo "============================================================"
          echo "macOS WEB DESKTOP"
          echo "============================================================"
          echo
          echo "URL:"
          echo
          echo "$TUNNEL_URL/vnc.html?autoconnect=true"
          echo
          echo "VNC username: $VNC_USERNAME"
          echo "VNC password: $VNC_PASSWORD"
          echo
          echo "Console user:"
          stat -f '%Su' /dev/console
          echo
          echo "============================================================"

          echo
          echo "noVNC log:"
          tail -n 20 /tmp/novnc.log || true

          echo
          echo "Cloudflare log:"
          tail -n 20 /tmp/cloudflared.log || true

          #
          # Keep the tunnel alive for the remainder of the job.
          #
          wait "$CLOUDFLARED_PID"

      - name: Keep Session Alive
        if: always()
        shell: bash
        run: |
          sleep 21600
