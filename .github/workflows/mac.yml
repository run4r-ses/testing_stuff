name: macOS GUI in Browser (noVNC)

on:
  workflow_dispatch:

jobs:
  macos-web-vnc:
    runs-on: macos-latest
    timeout-minutes: 245

    steps:
      - name: Configure Apple Remote Management and VNC
        shell: bash
        run: |
          set -euo pipefail

          ARD="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          # The GitHub-hosted runner already has a GUI session.
          CONSOLE_USER="$(stat -f '%Su' /dev/console)"

          if [[ "$CONSOLE_USER" == "root" || "$CONSOLE_USER" == "loginwindow" ]]; then
            echo "No active console GUI session."
            exit 1
          fi

          echo "Existing console user: $CONSOLE_USER"

          # Reduce unnecessary disk/CPU activity.
          sudo mdutil -i off -a >/dev/null 2>&1 || true

          # ------------------------------------------------------------
          # Create the account used by Apple's legacy VNC authentication.
          # This is intentionally retained because this is the setup
          # that previously authenticated successfully.
          # ------------------------------------------------------------

          if ! dscl . -read /Users/runneradmin >/dev/null 2>&1; then
            sudo dscl . -create /Users/runneradmin
            sudo dscl . -create /Users/runneradmin UserShell /bin/bash
            sudo dscl . -create /Users/runneradmin RealName "Runner Admin"
            sudo dscl . -create /Users/runneradmin UniqueID 1001
            sudo dscl . -create /Users/runneradmin PrimaryGroupID 80
            sudo dscl . -create /Users/runneradmin NFSHomeDirectory /Users/runneradmin
            sudo createhomedir -c -u runneradmin >/dev/null 2>&1 || true
          fi

          sudo dscl . -passwd /Users/runneradmin "meow"
          sudo dscl . -append /Groups/admin GroupMembership runneradmin 2>/dev/null || true

          # ------------------------------------------------------------
          # Apple Remote Management
          # ------------------------------------------------------------

          sudo "$ARD" \
            -activate \
            -configure \
            -allowAccessFor \
            -allUsers \
            -privs \
            -all

          sudo "$ARD" \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes

          # ------------------------------------------------------------
          # Generate the legacy Apple VNC password file.
          #
          # Legacy VNC uses only the first 8 password characters.
          # ------------------------------------------------------------

          VNC_HASH="$(
            printf '%s\n' "meow" |
            perl -we '
              BEGIN {
                @k = unpack "C*", pack "H*",
                  "1734516E8BA8C5E2FF1C39567390ADCA";
              }

              $_ = <>;
              chomp;

              s/^(.{8}).*/$1/;

              @p = unpack "C*", $_;

              foreach (@k) {
                printf "%02X", $_ ^ (shift @p || 0);
              }

              print "\n";
            '
          )"

          printf '%s\n' "$VNC_HASH" |
            sudo tee /Library/Preferences/com.apple.VNCSettings.txt >/dev/null

          unset VNC_HASH

          sudo chmod 600 \
            /Library/Preferences/com.apple.VNCSettings.txt

          # ------------------------------------------------------------
          # Restart ARD in the existing console session.
          # Keep this sequence identical to the configuration that
          # previously authenticated successfully.
          # ------------------------------------------------------------

          sudo "$ARD" \
            -restart \
            -agent \
            -console

          sleep 5

          sudo "$ARD" -activate

          sleep 5

          echo
          echo "VNC listener:"
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

          if ! nc -z 127.0.0.1 5900; then
            echo "VNC server is not listening on port 5900."
            exit 1
          fi

          echo
          echo "Apple VNC is listening on port 5900."

      - name: Install noVNC and Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/novnc

          git clone --depth 1 \
            https://github.com/novnc/noVNC.git \
            /tmp/novnc

          git clone --depth 1 \
            https://github.com/novnc/websockify \
            /tmp/novnc/utils/websockify

          brew install cloudflared

      - name: Start noVNC and Cloudflare Tunnel
        shell: bash
        run: |
          set -euo pipefail

          # ------------------------------------------------------------
          # VNC -> WebSocket bridge
          # ------------------------------------------------------------

          /tmp/novnc/utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 6080 \
            >/tmp/novnc.log 2>&1 &

          NOVNC_PID=$!

          sleep 3

          if ! kill -0 "$NOVNC_PID" 2>/dev/null; then
            echo "noVNC failed to start."
            cat /tmp/novnc.log
            exit 1
          fi

          if ! nc -z 127.0.0.1 6080; then
            echo "noVNC is not listening on port 6080."
            cat /tmp/novnc.log
            exit 1
          fi

          # ------------------------------------------------------------
          # Cloudflare Quick Tunnel
          # ------------------------------------------------------------

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --logfile /tmp/cloudflared.log \
            >/tmp/cloudflared.stdout 2>&1 &

          CLOUDFLARED_PID=$!

          TUNNEL_URL=""

          for _ in {1..30}; do
            TUNNEL_URL="$(
              grep -Eo \
                'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
                /tmp/cloudflared.log \
                /tmp/cloudflared.stdout \
                2>/dev/null |
              head -n 1 ||
              true
            )"

            if [[ -n "$TUNNEL_URL" ]]; then
              break
            fi

            sleep 1
          done

          if [[ -z "$TUNNEL_URL" ]]; then
            echo "Cloudflare Quick Tunnel failed to start."
            cat /tmp/cloudflared.log || true
            cat /tmp/cloudflared.stdout || true
            exit 1
          fi

          echo
          echo "============================================================"
          echo "WEB DESKTOP"
          echo "============================================================"
          echo
          echo "$TUNNEL_URL/vnc.html?autoconnect=true"
          echo
          echo "Username: runneradmin"
          echo "Password: meow"
          echo
          echo "============================================================"

          # Prevent shell cleanup from killing the processes.
          disown "$NOVNC_PID" || true
          disown "$CLOUDFLARED_PID" || true

      - name: Keep Session Alive
        shell: bash
        run: |
          sleep 14400
