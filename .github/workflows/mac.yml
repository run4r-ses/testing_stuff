name: macOS GUI in Browser (noVNC)

on:
  workflow_dispatch:

jobs:
  macos-web-vnc:
    runs-on: macos-14 # Or macos-latest
    steps:
      - name: Configure macOS Screen Sharing & Passwords
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          # 1. Truncate password to 8 characters and pad to 8 bytes
          RAW_PASS="${VNC_PASSWORD:0:8}"
          PADDED_PASS=$(printf "%-8s" "$RAW_PASS")

          # 2. Set 'runner' user password non-interactively via expect
          /usr/bin/expect <<EOF
          spawn sudo passwd runner
          expect "New password:"
          send "$RAW_PASS\r"
          expect "Retype new password:"
          send "$RAW_PASS\r"
          expect eof
          EOF

          # 3. Write VNC legacy password directly (bypassing broken kickstart -setvncpw)
          # Uses Apple's standard DES key: 5A7B4E765647624A
          ENC_HEX=$(echo -n "$PADDED_PASS" | openssl enc -des-ecb -K 5A7B4E765647624A -nopad 2>/dev/null | xxd -p -c 256)
          echo "$ENC_HEX" | sudo tee /Library/Preferences/com.apple.VNCSettings.txt > /dev/null
          sudo chmod 600 /Library/Preferences/com.apple.VNCSettings.txt

          # 4. Activate ARD / Screen Sharing daemon with full permissions
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -allowAccessFor -allUsers \
            -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -restart -agent

      - name: Install noVNC and Dependencies
        run: |
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc
          git clone --depth 1 https://github.com/novnc/websockify /tmp/novnc/utils/websockify
          brew install cloudflared

      - name: Launch noVNC Bridge & Cloudflare Tunnel
        run: |
          # Start noVNC proxying 5900 -> 6080
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 > /tmp/novnc.log 2>&1 &

          # Start Cloudflare tunnel
          cloudflared tunnel --url http://localhost:6080 --logfile /tmp/cloudflared.log &

          sleep 8

          TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1)

          echo "================================================================="
          echo "Open this URL in your browser:"
          echo "$TUNNEL_URL/vnc.html?autoconnect=true"
          echo "-----------------------------------------------------------------"
          echo "Password: (First 8 characters of your VNC_PASSWORD secret)"
          echo "================================================================="

      - name: Keep Session Active
        run: |
          sleep 14400
