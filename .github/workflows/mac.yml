name: macOS GUI in Browser (noVNC)

on:
  workflow_dispatch:

jobs:
  macos-web-vnc:
    runs-on: macos-latest
    timeout-minutes: 245

    steps:
      - name: Configure Remote Management and VNC
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${VNC_PASSWORD:-}" ]]; then
            echo "VNC_PASSWORD secret is not configured."
            exit 1
          fi

          ARD="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          # Disable Spotlight indexing.
          sudo mdutil -i off -a >/dev/null 2>&1 || true

          # The GitHub runner already has a logged-in graphical session.
          CONSOLE_USER="$(stat -f '%Su' /dev/console)"

          if [[ "$CONSOLE_USER" == "root" || "$CONSOLE_USER" == "loginwindow" ]]; then
            echo "No active macOS graphical console session."
            exit 1
          fi

          echo "Using existing GUI session: $CONSOLE_USER"

          # Enable Remote Management.
          sudo "$ARD" \
            -activate \
            -configure \
            -access \
            -on

          sudo "$ARD" \
            -configure \
            -allowAccessFor \
            -allUsers

          sudo "$ARD" \
            -configure \
            -privs \
            -all

          # Enable legacy VNC authentication.
          sudo "$ARD" \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes

          # Generate Apple's legacy VNC password file.
          VNC_HASH="$(
            printf '%s\n' "$VNC_PASSWORD" |
            perl -we '
              BEGIN {
                @k = unpack "C*", pack "H*",
                  "1734516E8BA8C5E2FF1C39567390ADCA";
              }

              $_ = <>;
              chomp;
              s/^(.{8}).*/$1/;

              @p = unpack "C*", $_;

              foreach (@k) {
                printf "%02X", $_ ^ (shift @p || 0);
              }

              print "\n";
            '
          )"

          printf '%s\n' "$VNC_HASH" |
            sudo tee /Library/Preferences/com.apple.VNCSettings.txt >/dev/null

          sudo chmod 600 \
            /Library/Preferences/com.apple.VNCSettings.txt

          unset VNC_HASH

          # Restart Remote Management so the VNC configuration is picked up.
          sudo "$ARD" -restart -agent

          sleep 5

          # Verify that VNC is actually listening.
          if ! nc -z 127.0.0.1 5900; then
            echo "VNC server failed to start."
            exit 1
          fi

      - name: Install noVNC
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/novnc

          git clone --depth 1 \
            https://github.com/novnc/noVNC.git \
            /tmp/novnc

          git clone --depth 1 \
            https://github.com/novnc/websockify \
            /tmp/novnc/utils/websockify

      - name: Install Cloudflare Tunnel
        shell: bash
        run: |
          set -euo pipefail

          brew install cloudflared

      - name: Start noVNC and Cloudflare Tunnel
        shell: bash
        run: |
          set -euo pipefail

          # Start the WebSocket-to-VNC bridge.
          /tmp/novnc/utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 6080 \
            >/tmp/novnc.log 2>&1 &

          NOVNC_PID=$!

          sleep 3

          if ! kill -0 "$NOVNC_PID" 2>/dev/null; then
            echo "noVNC failed to start."
            cat /tmp/novnc.log || true
            exit 1
          fi

          if ! nc -z 127.0.0.1 6080; then
            echo "noVNC is not listening on port 6080."
            exit 1
          fi

          # Start Cloudflare Quick Tunnel.
          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --logfile /tmp/cloudflared.log \
            >/tmp/cloudflared.stdout 2>&1 &

          CLOUDFLARED_PID=$!

          TUNNEL_URL=""

          for _ in {1..30}; do
            sleep 1

            TUNNEL_URL="$(
              grep -Eo \
                'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
                /tmp/cloudflared.log \
                /tmp/cloudflared.stdout \
                2>/dev/null |
              head -n 1 ||
              true
            )"

            if [[ -n "$TUNNEL_URL" ]]; then
              break
            fi
          done

          if [[ -z "$TUNNEL_URL" ]]; then
            echo "Cloudflare tunnel failed to start."
            cat /tmp/cloudflared.log || true
            cat /tmp/cloudflared.stdout || true
            exit 1
          fi

          echo
          echo "============================================================"
          echo "macOS Web Desktop"
          echo "============================================================"
          echo
          echo "$TUNNEL_URL/vnc.html"
          echo
          echo "VNC password: the value configured in the VNC_PASSWORD secret."
          echo
          echo "============================================================"

          # Keep the processes alive if this shell exits.
          disown "$NOVNC_PID" || true
          disown "$CLOUDFLARED_PID" || true

      - name: Keep Session Active
        shell: bash
        run: |
          sleep 14400
