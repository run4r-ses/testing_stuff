name: macOS GUI in Browser (noVNC)

on:
  workflow_dispatch:

jobs:
  macos-web-vnc:
    runs-on: macos-latest
    steps:
      - name: Launch macOS GUI, noVNC & Cloudflare Tunnel
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          # 1. Prevent virtual display sleep and system idle power down
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0
          caffeinate -u -d -i -s &

          # 2. Configure Apple Remote Management for legacy VNC access
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -allowAccessFor -allUsers -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes

          # 3. Write legacy VNC password hash
          echo "$VNC_PASSWORD" | perl -we '
            BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"};
            $_ = <>; chomp; s/^(.{8}).*/$1/;
            @p = unpack "C*", $_;
            foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) };
            print "\n"
          ' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt > /dev/null
          sudo chmod 600 /Library/Preferences/com.apple.VNCSettings.txt

          # 4. Restart ARD Agent in the active console session
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent -console
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate

          # 5. Wake the virtual display framebuffer
          osascript -e 'tell application "System Events" to key code 53' || true

          # 6. Install noVNC, websockify, and Cloudflare Tunnel
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc
          git clone --depth 1 https://github.com/novnc/websockify /tmp/novnc/utils/websockify
          brew install cloudflared

          # 7. Start noVNC proxy (VNC 5900 -> WS 6080)
          /tmp/novnc/utils/novnc_proxy --vnc 127.0.0.1:5900 --listen 6080 --web /tmp/novnc > /tmp/novnc.log 2>&1 &

          # 8. Start Cloudflare Tunnel
          cloudflared tunnel --url http://127.0.0.1:6080 --logfile /tmp/cloudflared.log > /dev/null 2>&1 &

          echo "Waiting for Cloudflare Tunnel URL..."
          TUNNEL_URL=""
          for i in {1..30}; do
            if [ -f /tmp/cloudflared.log ]; then
              TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
              if [ -n "$TUNNEL_URL" ]; then
                break
              fi
            fi
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Error: Failed to obtain Cloudflare Tunnel URL."
            cat /tmp/cloudflared.log
            exit 1
          fi

          # Allow Cloudflare edge DNS to propagate
          sleep 5

          echo "================================================================="
          echo "Web Desktop URL:"
          echo "$TUNNEL_URL/vnc.html?autoconnect=true&resize=scale"
          echo "-----------------------------------------------------------------"
          echo "VNC Password: (Your configured VNC_PASSWORD secret)"
          echo "================================================================="

          # 9. Keep everything alive in this single step
          while true; do
            sleep 60
          done
