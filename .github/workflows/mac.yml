name: macOS GUI in Browser (noVNC)

on:
  workflow_dispatch:

jobs:
  macos-web-vnc:
    runs-on: macos-latest
    timeout-minutes: 245

    steps:
      - name: Configure macOS VNC
        shell: bash
        run: |
          set -euo pipefail

          ARD="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          VNC_PASSWORD="meow"
          MAC_PASSWORD="meow"
          CONSOLE_USER="$(stat -f '%Su' /dev/console)"

          echo "Console user: $CONSOLE_USER"

          if [[ "$CONSOLE_USER" == "root" || "$CONSOLE_USER" == "loginwindow" ]]; then
            echo "No active GUI session."
            exit 1
          fi

          # ----------------------------------------------------------
          # Reset the existing runner account password.
          #
          # This is a diagnostic test. It is NOT normally required for
          # legacy VNC authentication.
          # ----------------------------------------------------------

          sudo sysadminctl \
            -resetPasswordFor "$CONSOLE_USER" \
            -newPassword "$MAC_PASSWORD"

          # ----------------------------------------------------------
          # Disable any existing Screen Sharing configuration first.
          # Remote Management and Screen Sharing cannot coexist.
          # ----------------------------------------------------------

          sudo "$ARD" -deactivate || true

          # Stop existing Apple sharing processes.
          sudo pkill -TERM screensharingd 2>/dev/null || true
          sudo pkill -TERM ScreensharingAgent 2>/dev/null || true
          sudo pkill -TERM ARDAgent 2>/dev/null || true

          sleep 3

          # ----------------------------------------------------------
          # Enable Remote Management for the EXISTING runner user.
          # ----------------------------------------------------------

          sudo "$ARD" \
            -activate \
            -configure \
            -access -on \
            -allowAccessFor -allUsers \
            -privs -all

          # ----------------------------------------------------------
          # Enable legacy VNC authentication and explicitly set the
          # VNC password.
          #
          # IMPORTANT:
          # Do NOT manually write com.apple.VNCSettings.txt here.
          # Let kickstart generate the value it expects.
          # ----------------------------------------------------------

          sudo "$ARD" \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes \
            -setvncpw \
            -vncpw "$VNC_PASSWORD"

          # Do not require a user to approve the VNC connection.
          sudo "$ARD" \
            -configure \
            -clientopts \
            -setreqperm \
            -reqperm no

          # ----------------------------------------------------------
          # Restart the Apple Remote Management/VNC stack.
          # ----------------------------------------------------------

          sudo "$ARD" -restart -agent -console

          sleep 8

          # ----------------------------------------------------------
          # Verify that Apple's VNC server is listening.
          # ----------------------------------------------------------

          echo
          echo "VNC listener:"
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

          if ! nc -z 127.0.0.1 5900; then
            echo "ERROR: Nothing is listening on TCP 5900."
            exit 1
          fi

          echo
          echo "============================================================"
          echo "macOS VNC is ready"
          echo "============================================================"
          echo
          echo "VNC username: runner"
          echo "VNC password: meow"
          echo
          echo "macOS account password was also reset to: meow"
          echo
          echo "============================================================"

      - name: Install noVNC and Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/novnc

          git clone --depth 1 \
            https://github.com/novnc/noVNC.git \
            /tmp/novnc

          git clone --depth 1 \
            https://github.com/novnc/websockify \
            /tmp/novnc/utils/websockify

          brew install cloudflared

      - name: Start noVNC
        shell: bash
        run: |
          set -euo pipefail

          /tmp/novnc/utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 6080 \
            >/tmp/novnc.log 2>&1 &

          sleep 3

          if ! nc -z 127.0.0.1 6080; then
            echo "noVNC failed to start:"
            cat /tmp/novnc.log
            exit 1
          fi

      - name: Start Cloudflare Tunnel
        shell: bash
        run: |
          set -euo pipefail

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --logfile /tmp/cloudflared.log \
            >/tmp/cloudflared.stdout 2>&1 &

          TUNNEL_URL=""

          for _ in {1..30}; do
            TUNNEL_URL="$(
              grep -Eo \
                'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
                /tmp/cloudflared.log \
                /tmp/cloudflared.stdout \
                2>/dev/null |
              head -n 1 ||
              true
            )"

            if [[ -n "$TUNNEL_URL" ]]; then
              break
            fi

            sleep 1
          done

          if [[ -z "$TUNNEL_URL" ]]; then
            echo "Cloudflare tunnel failed."
            cat /tmp/cloudflared.log || true
            cat /tmp/cloudflared.stdout || true
            exit 1
          fi

          echo
          echo "============================================================"
          echo "WEB DESKTOP"
          echo "============================================================"
          echo
          echo "$TUNNEL_URL/vnc.html?autoconnect=true"
          echo
          echo "Username: runner"
          echo "Password: meow"
          echo
          echo "============================================================"

      - name: Keep Session Alive
        shell: bash
        run: |
          sleep 14400
