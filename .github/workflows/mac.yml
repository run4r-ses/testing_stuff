name: macOS GUI in Browser (noVNC)

on:
  workflow_dispatch:

jobs:
  macos-web-vnc:
    runs-on: macos-latest
    timeout-minutes: 245

    steps:
      - name: Enable Native macOS Screen Sharing
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -euo pipefail

          ARD="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          SCREENSHARING_PLIST="/System/Library/LaunchDaemons/com.apple.screensharing.plist"

          if [[ -z "${VNC_PASSWORD:-}" ]]; then
            echo "VNC_PASSWORD secret is empty."
            exit 1
          fi

          CONSOLE_USER="$(stat -f '%Su' /dev/console)"

          if [[ "$CONSOLE_USER" == "root" || "$CONSOLE_USER" == "loginwindow" ]]; then
            echo "No active GUI session."
            exit 1
          fi

          echo "Console user: $CONSOLE_USER"

          # ------------------------------------------------------------
          # 1. Completely disable Remote Management.
          #
          # Apple does not allow Remote Management and Screen Sharing
          # to be enabled simultaneously.
          # ------------------------------------------------------------

          sudo "$ARD" -deactivate || true

          # ------------------------------------------------------------
          # 2. Enable Apple's native Screen Sharing launch daemon.
          # ------------------------------------------------------------

          sudo launchctl enable system/com.apple.screensharing || true

          # Unload an existing instance if present.
          sudo launchctl bootout system/com.apple.screensharing 2>/dev/null || true

          # Start Screen Sharing.
          sudo launchctl bootstrap system "$SCREENSHARING_PLIST"

          sleep 5

          # ------------------------------------------------------------
          # 3. Configure the legacy VNC password.
          #
          # Apple VNC authentication uses the legacy 8-character
          # password mechanism.
          # ------------------------------------------------------------

          sudo "$ARD" \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes

          sudo "$ARD" \
            -configure \
            -clientopts \
            -setvncpw \
            -vncpw "$VNC_PASSWORD"

          # ------------------------------------------------------------
          # 4. Make sure Screen Sharing is actually running.
          # ------------------------------------------------------------

          sleep 5

          echo
          echo "Screen Sharing service:"
          sudo launchctl print system/com.apple.screensharing 2>/dev/null || true

          echo
          echo "VNC listener:"
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

          if ! nc -z 127.0.0.1 5900; then
            echo
            echo "Screen Sharing is NOT listening on TCP 5900."
            echo
            echo "Recent screensharing logs:"
            log show \
              --last 2m \
              --style compact \
              --predicate 'process == "screensharingd" OR process == "screensharingd"' \
              2>/dev/null |
              tail -100 || true

            exit 1
          fi

          echo
          echo "============================================================"
          echo "Native macOS Screen Sharing is listening on :5900"
          echo "============================================================"

      - name: Install noVNC and Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/novnc

          git clone --depth 1 \
            https://github.com/novnc/noVNC.git \
            /tmp/novnc

          git clone --depth 1 \
            https://github.com/novnc/websockify \
            /tmp/novnc/utils/websockify

          brew install cloudflared

      - name: Start noVNC and Cloudflare Tunnel
        shell: bash
        run: |
          set -euo pipefail

          /tmp/novnc/utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 6080 \
            >/tmp/novnc.log 2>&1 &

          NOVNC_PID=$!

          sleep 3

          if ! kill -0 "$NOVNC_PID" 2>/dev/null; then
            echo "noVNC failed to start."
            cat /tmp/novnc.log
            exit 1
          fi

          if ! nc -z 127.0.0.1 6080; then
            echo "noVNC is not listening on :6080."
            cat /tmp/novnc.log
            exit 1
          fi

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --logfile /tmp/cloudflared.log \
            >/tmp/cloudflared.stdout 2>&1 &

          CLOUDFLARED_PID=$!

          TUNNEL_URL=""

          for _ in {1..30}; do
            TUNNEL_URL="$(
              grep -Eo \
                'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
                /tmp/cloudflared.log \
                /tmp/cloudflared.stdout \
                2>/dev/null |
              head -n 1 ||
              true
            )"

            if [[ -n "$TUNNEL_URL" ]]; then
              break
            fi

            sleep 1
          done

          if [[ -z "$TUNNEL_URL" ]]; then
            echo "Cloudflare tunnel failed."
            cat /tmp/cloudflared.log || true
            cat /tmp/cloudflared.stdout || true
            exit 1
          fi

          echo
          echo "============================================================"
          echo "WEB DESKTOP"
          echo "============================================================"
          echo
          echo "$TUNNEL_URL/vnc.html?autoconnect=true"
          echo
          echo "Username: leave blank"
          echo "Password: VNC_PASSWORD secret"
          echo
          echo "============================================================"

          disown "$NOVNC_PID" || true
          disown "$CLOUDFLARED_PID" || true

      - name: Keep Session Alive
        shell: bash
        run: |
          sleep 14400
