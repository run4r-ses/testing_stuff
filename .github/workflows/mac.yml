name: macOS VM

on:
  workflow_dispatch:

jobs:
  macos-rustdesk:
    runs-on: macos-latest
    timeout-minutes: 370

    env:
      RUSTDESK_USERNAME: goldenrecipe
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          echo "- Installing display utilities and tunnel tools"
          brew install displayplacer desktoppr bore-cli

          echo "- Installing RustDesk"
          brew install --cask rustdesk
          sudo xattr -cr /Applications/RustDesk.app 2>/dev/null || true
          sudo xattr -rd com.apple.quarantine /Applications/RustDesk.app 2>/dev/null || true

      - name: Setup user
        shell: bash
        run: bash scripts/setup.sh

      - name: Optimize macOS
        shell: bash
        run: bash scripts/optimize/main.sh

      - name: Patch TCC permissions
        shell: bash
        run: bash scripts/tcc.sh

      - name: Configure RustDesk
        shell: bash
        run: bash scripts/rustdesk/main.sh

      - name: Connection information
        shell: bash
        run: bash scripts/rustdesk/info.sh

      - name: Monitor session
        shell: bash
        run: bash scripts/rustdesk/keepalive.sh
