name: macOS VM

on:
  workflow_dispatch:

jobs:
  macos-rdp:
    runs-on: macos-latest
    timeout-minutes: 370

    env:
      RDP_USERNAME: goldenrecipe
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD || secrets.RUSTDESK_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          echo "- Installing display utilities and tunnel tools"
          brew install displayplacer desktoppr bore-cli

      - name: Setup user
        shell: bash
        run: bash scripts/setup.sh

      - name: Optimize macOS
        shell: bash
        run: bash scripts/optimize/main.sh

      - name: Patch TCC permissions
        shell: bash
        run: bash scripts/tcc.sh

      - name: Configure Apple Remote Desktop
        shell: bash
        run: bash scripts/rdp/main.sh

      - name: Connection information
        shell: bash
        run: bash scripts/rdp/info.sh

      - name: Monitor session
        shell: bash
        run: bash scripts/rdp/keepalive.sh
