name: macOS GUI in Browser (noVNC)

on:
  workflow_dispatch:

jobs:
  macos-web-vnc:
    runs-on: macos-latest
    timeout-minutes: 245

    steps:
      - name: Configure VNC
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -euo pipefail

          ARD="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          if [[ -z "$VNC_PASSWORD" ]]; then
            echo "VNC_PASSWORD is empty"
            exit 1
          fi

          CONSOLE_USER="$(stat -f '%Su' /dev/console)"

          if [[ "$CONSOLE_USER" == "root" || "$CONSOLE_USER" == "loginwindow" ]]; then
            echo "No active GUI session"
            exit 1
          fi

          echo "Console user: $CONSOLE_USER"

          # Enable Remote Management for the existing GUI user.
          sudo "$ARD" \
            -activate \
            -configure \
            -access -on \
            -allowAccessFor -allUsers \
            -privs -all

          # Enable legacy VNC authentication.
          sudo "$ARD" \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes

          # Let Apple's kickstart utility create/configure the VNC
          # password instead of manually writing VNCSettings.txt.
          sudo "$ARD" \
            -configure \
            -clientopts \
            -setvncpw \
            -vncpw "$VNC_PASSWORD"

          # Restart into the existing console session.
          sudo "$ARD" \
            -restart \
            -agent \
            -console

          sleep 5

          sudo "$ARD" -activate

          sleep 3

          echo "VNC listener:"
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

          if ! nc -z 127.0.0.1 5900; then
            echo "VNC server is not listening"
            exit 1
          fi

          echo "VNC ready."

      - name: Install noVNC
        run: |
          set -euo pipefail

          rm -rf /tmp/novnc

          git clone --depth 1 \
            https://github.com/novnc/noVNC.git \
            /tmp/novnc

          git clone --depth 1 \
            https://github.com/novnc/websockify \
            /tmp/novnc/utils/websockify

          brew install cloudflared

      - name: Start noVNC
        run: |
          set -euo pipefail

          /tmp/novnc/utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 6080 \
            >/tmp/novnc.log 2>&1 &

          sleep 3

          if ! nc -z 127.0.0.1 6080; then
            cat /tmp/novnc.log
            exit 1
          fi

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --logfile /tmp/cloudflared.log \
            >/tmp/cloudflared.stdout 2>&1 &

          TUNNEL_URL=""

          for i in {1..30}; do
            TUNNEL_URL="$(
              grep -Eo \
                'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
                /tmp/cloudflared.log \
                /tmp/cloudflared.stdout \
                2>/dev/null |
              head -n 1 || true
            )"

            [[ -n "$TUNNEL_URL" ]] && break
            sleep 1
          done

          if [[ -z "$TUNNEL_URL" ]]; then
            echo "Cloudflare tunnel failed"
            cat /tmp/cloudflared.log || true
            cat /tmp/cloudflared.stdout || true
            exit 1
          fi

          echo
          echo "============================================================"
          echo "OPEN THIS:"
          echo
          echo "$TUNNEL_URL/vnc.html?autoconnect=true"
          echo
          echo "VNC password: VNC_PASSWORD secret"
          echo
          echo "IMPORTANT: leave Username EMPTY"
          echo "============================================================"

      - name: Keep Session Alive
        run: sleep 14400
