name: macOS VM

on:
  workflow_dispatch:

jobs:
  macos-vnc:
    runs-on: macos-latest
    timeout-minutes: 370

    env:
      VNC_USERNAME: runneradmin
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        shell: bash
        run: |
          echo "- Installing cloudflared"
          brew install cloudflared

          echo "- Downloading noVNC and Websockify"
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc
          git clone --depth 1 https://github.com/novnc/websockify /tmp/novnc/utils/websockify

      - name: Optimize macOS
        shell: bash
        run: bash scripts/optimize/main.sh

      - name: Setup user
        shell: bash
        run: bash scripts/setup.sh

      - name: Patch TCC permissions
        shell: bash
        run: bash scripts/tcc.sh

      - name: Configure and start VNC server
        shell: bash
        run: bash scripts/vnc.sh

      - name: Start VNC tunnel
        shell: bash
        run: bash scripts/tunnel.sh
