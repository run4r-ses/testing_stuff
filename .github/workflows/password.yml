name: MacOS Password Change Roulette
on: [workflow_dispatch]

jobs:
  password-tests:
    name: Test Password Change Methods
    runs-on: macos-latest
    
    steps:
      - name: 📝 System Info
        run: |
          echo "macOS Version: $(sw_vers -productVersion)"
          echo "Runner User: $(whoami)"

      - name: 1️⃣ dscl (Standard Argument)
        continue-on-error: true
        run: |
          echo "🔄 Scrambling password..."
          sudo dscl . -passwd /Users/runner "$(uuidgen)"
          
          echo "🚀 Attempting: sudo dscl . -passwd /Users/runner 'meow'"
          sudo dscl . -passwd /Users/runner "meow"
          
          echo "🧪 Verifying..."
          if dscl . -authonly runner "meow" 2>/dev/null; then
            echo "✅ SUCCESS: Password changed to 'meow'"
            exit 0
          else
            echo "❌ FAILED: Password is NOT 'meow'"
            exit 1
          fi

      - name: 2️⃣ dscl (Explicit Blank Old Password)
        continue-on-error: true
        run: |
          echo "🔄 Scrambling password..."
          sudo dscl . -passwd /Users/runner "$(uuidgen)"
          
          echo "🚀 Attempting: sudo dscl . -passwd /Users/runner \"\" 'meow'"
          sudo dscl . -passwd /Users/runner "" "meow"
          
          echo "🧪 Verifying..."
          if dscl . -authonly runner "meow" 2>/dev/null; then
            echo "✅ SUCCESS: Password changed to 'meow'"
            exit 0
          else
            echo "❌ FAILED: Password is NOT 'meow'"
            exit 1
          fi

      - name: 3️⃣ sysadminctl (Apple Native)
        continue-on-error: true
        run: |
          echo "🔄 Scrambling password..."
          sudo dscl . -passwd /Users/runner "$(uuidgen)"
          
          echo "🚀 Attempting: sudo sysadminctl -resetPasswordFor runner -newPassword 'meow'"
          sudo sysadminctl -resetPasswordFor runner -newPassword "meow" 2>/dev/null || true
          
          echo "🧪 Verifying..."
          if dscl . -authonly runner "meow" 2>/dev/null; then
            echo "✅ SUCCESS: Password changed to 'meow'"
            exit 0
          else
            echo "❌ FAILED: Password is NOT 'meow' (Likely SecureToken block)"
            exit 1
          fi

      - name: 4️⃣ TTY Automation via 'expect'
        continue-on-error: true
        run: |
          echo "🔄 Scrambling password..."
          sudo dscl . -passwd /Users/runner "$(uuidgen)"
          
          echo "🚀 Attempting: expect script with sudo passwd runner"
          expect <<EOF
          spawn sudo passwd runner
          expect "New password:"
          send "meow\r"
          expect "Retype new password:"
          send "meow\r"
          expect eof
          EOF
          
          echo "🧪 Verifying..."
          if dscl . -authonly runner "meow" 2>/dev/null; then
            echo "✅ SUCCESS: Password changed to 'meow'"
            exit 0
          else
            echo "❌ FAILED: Password is NOT 'meow'"
            exit 1
          fi

      - name: 5️⃣ TTY Automation via Python PTY
        continue-on-error: true
        run: |
          echo "🔄 Scrambling password..."
          sudo dscl . -passwd /Users/runner "$(uuidgen)"
          
          echo "🚀 Attempting: Python standard library pty module"
          python3 -c '
          import pty, os, time
          master, slave = pty.openpty()
          pid = os.fork()
          if pid == 0:
              os.close(master)
              os.dup2(slave, 0)
              os.dup2(slave, 1)
              os.dup2(slave, 2)
              os.execlp("sudo", "sudo", "passwd", "runner")
          else:
              os.close(slave)
              time.sleep(0.5)
              os.write(master, b"meow\n")
              time.sleep(0.5)
              os.write(master, b"meow\n")
              os.waitpid(pid, 0)
          '
          
          echo "🧪 Verifying..."
          if dscl . -authonly runner "meow" 2>/dev/null; then
            echo "✅ SUCCESS: Password changed to 'meow'"
            exit 0
          else
            echo "❌ FAILED: Password is NOT 'meow'"
            exit 1
          fi

      - name: 6️⃣ TTY Automation via Ruby PTY
        continue-on-error: true
        run: |
          echo "🔄 Scrambling password..."
          sudo dscl . -passwd /Users/runner "$(uuidgen)"
          
          echo "🚀 Attempting: Ruby PTY library"
          ruby -rpty -e '
            PTY.spawn("sudo passwd runner") do |r, w, pid|
              r.gets # Wait for first prompt
              w.puts "meow"
              r.gets # Wait for second prompt
              w.puts "meow"
              Process.wait(pid)
            end
          ' || true
          
          echo "🧪 Verifying..."
          if dscl . -authonly runner "meow" 2>/dev/null; then
            echo "✅ SUCCESS: Password changed to 'meow'"
            exit 0
          else
            echo "❌ FAILED: Password is NOT 'meow'"
            exit 1
          fi

      - name: 7️⃣ osascript (AppleScript Shell Evaluation)
        continue-on-error: true
        run: |
          echo "🔄 Scrambling password..."
          sudo dscl . -passwd /Users/runner "$(uuidgen)"
          
          echo "🚀 Attempting: osascript 'do shell script'"
          sudo osascript -e 'do shell script "dscl . -passwd /Users/runner meow"' || true
          
          echo "🧪 Verifying..."
          if dscl . -authonly runner "meow" 2>/dev/null; then
            echo "✅ SUCCESS: Password changed to 'meow'"
            exit 0
          else
            echo "❌ FAILED: Password is NOT 'meow'"
            exit 1
          fi

      - name: 8️⃣ Standard Stdin Piping (The Linux Way)
        continue-on-error: true
        run: |
          echo "🔄 Scrambling password..."
          sudo dscl . -passwd /Users/runner "$(uuidgen)"
          
          echo "🚀 Attempting: echo -e | sudo passwd (Usually fails on macOS due to strict TTY checks)"
          echo -e "meow\nmeow" | sudo passwd runner 2>/dev/null || true
          
          echo "🧪 Verifying..."
          if dscl . -authonly runner "meow" 2>/dev/null; then
            echo "✅ SUCCESS: Password changed to 'meow'"
            exit 0
          else
            echo "❌ FAILED: Password is NOT 'meow'"
            exit 1
          fi
